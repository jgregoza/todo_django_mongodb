[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "staticfiles",
    "media",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"seed_data.py" = ["E402"]
"pythonanywhere_wsgi.py" = ["E402"]


[tool.coverage.run]
source = ["todos", "config"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
