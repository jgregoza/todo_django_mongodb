{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 - Solicitud Incorrecta | TaskPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% include "partials/theme_init.html" %}
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'todos/app.css' %}?v={{ APP_VERSION }}">
  <script src="{% static 'todos/app.js' %}" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4">
  <div class="fixed top-4 right-4 z-20">
    {% include "partials/theme_toggle.html" %}
  </div>

  <div class="max-w-md w-full bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-slate-950/60 text-center">
    <div class="w-16 h-16 rounded-2xl bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 text-amber-600 dark:text-amber-400 flex items-center justify-center mx-auto mb-4">
      <i data-lucide="alert-triangle" class="w-8 h-8"></i>
    </div>
    <span class="text-xs font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-200 dark:border-amber-500/30">Error 400</span>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-white mt-3 mb-2">Solicitud Incorrecta</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">El servidor no pudo procesar la solicitud debido a datos con formato no válido o parámetros incorrectos.</p>
    <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md transition">
      <i data-lucide="home" class="w-4 h-4"></i> Volver al inicio
    </a>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
