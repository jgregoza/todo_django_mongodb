<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - No Encontrado | TaskPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl text-center">
    <div class="w-16 h-16 rounded-2xl bg-slate-100 border border-slate-200 text-slate-600 flex items-center justify-center mx-auto mb-4">
      <i data-lucide="file-question" class="w-8 h-8"></i>
    </div>
    <span class="text-xs font-bold uppercase tracking-wider text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200">Error 404</span>
    <h1 class="text-2xl font-bold text-slate-900 mt-3 mb-2">Página no encontrada</h1>
    <p class="text-sm text-slate-500 mb-6">La página que buscas no existe o fue movida. Revisa la dirección o vuelve al inicio para continuar con tus tareas.</p>
    <a href="{% url 'index' %}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md transition">
      <i data-lucide="home" class="w-4 h-4"></i> Volver al inicio
    </a>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
