<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | TaskPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white mx-auto mb-3 shadow-md shadow-emerald-500/20">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Iniciar Sesión</h1>
      <p class="text-xs text-slate-500 mt-1">Accede a tus tareas sincronizadas</p>
    </div>

    {% if messages %}
    <div class="mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-xs rounded-xl {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Usuario</label>
        <input type="text" name="username" required autofocus class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Contraseña</label>
        <input type="password" name="password" required class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
      </div>

      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-emerald-600/25 transition mt-2">
        Entrar a mi cuenta
      </button>
    </form>

    <div class="mt-6 text-center pt-6 border-t border-slate-100 text-xs text-slate-500">
      ¿No tienes cuenta? 
      <a href="{% url 'register' %}" class="font-bold text-emerald-600 hover:text-emerald-700">Regístrate aquí</a>
      <div class="mt-3">
        <a href="{% url 'index' %}" class="text-slate-400 hover:text-slate-600">&larr; Volver al inicio</a>
      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
